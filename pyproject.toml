[project]
name = "movie-discovery"
version = "0.1.0"
description = "An agentic movie discovery tool that leverages LangChain, OpenAI, and other libraries to provide personalized movie recommendations based on user preferences and interactions."
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.17.3",
    "huggingface-hub>=0.33.4,<1.0.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.0.2",
    "langgraph>=1.2.16",
    "matplotlib>=3.11.2",
    "nbformat>=4.2.0",
    "openai>=3.19.2",
    "pandas>=3.0.1",
    "pip>=26.2.1",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]
